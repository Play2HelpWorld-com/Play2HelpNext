<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Meadow Run</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background:
		radial-gradient(circle at 18% 18%, #fff6a3 0 42px, transparent 43px),
		linear-gradient(170deg, transparent 0 56%, rgba(73, 184, 99, 0.36) 56% 69%, transparent 69%),
		linear-gradient(190deg, transparent 0 62%, rgba(132, 215, 132, 0.42) 62% 78%, transparent 78%),
		linear-gradient(180deg, #dff4ff 0%, #f9fff2 58%, #e5ffd9 100%);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background:
		radial-gradient(circle at 22% 22%, rgba(255, 246, 163, 0.95) 0 34px, transparent 35px),
		linear-gradient(180deg, rgba(223, 244, 255, 0.96) 0%, rgba(247, 255, 238, 0.96) 68%, rgba(214, 247, 197, 0.96) 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	color: #173231;
	font-family: Arial, sans-serif;
}

#status::before {
	content: "Meadow Run";
	margin-bottom: 1rem;
	padding: 0.7rem 1.1rem;
	border: 4px solid #275f38;
	border-radius: 8px;
	background: rgba(255, 255, 255, 0.88);
	color: #245a34;
	box-shadow: 8px 8px 0 rgba(39, 95, 56, 0.2);
	font-size: clamp(2.2rem, 8vw, 5rem);
	font-weight: 900;
	line-height: 1;
	text-transform: uppercase;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	border: 4px solid rgba(39, 95, 56, 0.55);
	border-radius: 8px;
	box-shadow: 0 18px 45px rgba(39, 95, 56, 0.22);
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
	height: 18px;
	overflow: hidden;
	border: 3px solid #275f38;
	border-radius: 8px;
	background: rgba(255, 255, 255, 0.78);
}

#status-progress::-webkit-progress-bar {
	background: rgba(255, 255, 255, 0.78);
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #caffbf, #6fcf83);
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #caffbf, #6fcf83);
}

#status-notice {
	background-color: rgba(255, 255, 255, 0.9);
	border-radius: 8px;
	border: 3px solid #d65f5f;
	color: #173231;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":432528,"index.wasm":43016933},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
